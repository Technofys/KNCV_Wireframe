<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="kncv-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="kncv-shadow" x="0" y="4" width="120" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1D4ED8" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Shield Badge -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#kncv-grad)" filter="url(#kncv-shadow)" />
  <!-- International TB Double Cross (Cross of Lorraine) -->
  <path d="M60 24V96" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
  <path d="M42 45H78" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
  <path d="M33 66H87" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
</svg>
